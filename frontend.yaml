apiVersion: apps/v1
kind: Deployment
metadata:
    name: frontend
    labels: 
      app: frontend
spec:
    replicas: 2
    selector: 
      matchLabels:  
        app: frontend
    template:
        metadata:
          labels:
            app: frontend
        spec:
          containers:
          - name: frontend
            image: "{{ ecr_server }}/{{ ecr_frontend_repo }}:{{ image_version }}"
            imagePullPolicy: Always
            ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 80    
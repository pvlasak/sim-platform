# Reverse proxy for docker compose: routes /api to the backend, everything else to the frontend.
# EKS does the same routing with ingress-api.yaml and ingress-frontend.yaml; keep them in sync.
server {
    listen 80;

    # No upload size limit (nginx default is 1 MB) — needed for model uploads
    client_max_body_size 0;

    # /api/models -> http://backend:8000/models
    # The trailing "/" in proxy_pass strips the /api prefix
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;   # allow slow requests (10 min)
        proxy_send_timeout 600;
    }

    # Everything else -> frontend nginx (static files + SPA fallback)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

